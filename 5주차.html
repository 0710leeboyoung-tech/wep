<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>스타일시트 이해하기</title>
    <style type="text/css">
       
        h3:before {
            content: "◆";
            color: blue;
        }
        h3:after {
            content: " (©sblim)";
            font-size: 10pt;
            font-weight: normal;
        }

   
        a:link {
            color: blue;
        }
    </style>
</head>
<body>

    <h3>스타일시트 이해하기</h3>

    <p>이 예제는 <strong>CSS</strong>의 개념을 설명합니다.</p>

    <p>선택자에 <a href="#">가상클래스</a>와 <a href="#">선택자 조합</a>을 적용하여 스타일을 지정합니다.</p>

</body>
</html>
